# Loader build properties (mod id is `kairos`).
loom.platform=forge
org.gradle.jvmargs=-Xmx2g

baseGroup = dev.kairos
mcVersion = 1.8.9
modid = kairos
version = 0.1.0

# --- Java 8 toolchain ---
# This machine has JDK 21 and JDK 25 but no JDK 8. Local auto-detection could pick a JRE 8
# (no javac), so detection is off and the official foojay resolver provisions a real
# Temurin 8 JDK into this repo's .gradle-home (see docs/JOURNAL.md).
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true
